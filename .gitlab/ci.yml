# GitLab CI: build Docker image and push to Alibaba Cloud ACR.
# Config path: .gitlab/ci.yml — set in Project → Settings → CI/CD → General pipelines
# → "CI/CD configuration file" (GitLab does not auto-detect this path).
#
# Runner: docker executor + privileged dind (see [runners.docker] privileged = true).
#
# CI job images from ACR (${ACR_REGISTRY}/opencsg_public/...) to avoid Docker Hub timeouts.
# Dockerfile builder/runtime bases use opencsghq ACR mirrors that preserve the
# upstream multi-arch indexes for linux/amd64 and linux/arm64.
#
# Required CI/CD variables:
#   ACR_REGISTRY, ACR_USERNAME, ACR_PASSWORD
#
# Tag: YYYY.M.D (Asia/Shanghai). Multi-arch: manifest list for linux/amd64 + linux/arm64.
#
# Binfmt (QEMU): Docker Hub (tonistiigi/binfmt) is often blocked in CN CI. Default
# BINFMT_IMAGE points at ACR — mirror once, e.g.:
#   docker pull tonistiigi/binfmt:latest
#   docker tag tonistiigi/binfmt:latest ${ACR_REGISTRY}/opencsg_public/binfmt:latest
#   docker push ${ACR_REGISTRY}/opencsg_public/binfmt:latest
# Or set CI variable SKIP_BINFMT_INSTALL=true if the GitLab Runner host already
# has binfmt_misc + qemu-user registered for arm64.
#
# BuildKit (docker-container driver): buildx bootstrap pulls moby/buildkit from
# Docker Hub by default — mirror to ACR and set BUILDKIT_CI_IMAGE, e.g.:
#   docker pull moby/buildkit:buildx-stable-1
#   docker tag moby/buildkit:buildx-stable-1 ${ACR_REGISTRY}/opencsg_public/moby-buildkit:buildx-stable-1
#   docker push ${ACR_REGISTRY}/opencsg_public/moby-buildkit:buildx-stable-1

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"
  RUNTIME_ALPINE_BASE_IMAGE: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/alpine:3.23"
  BINFMT_IMAGE: "${ACR_REGISTRY}/opencsg_public/binfmt:latest"
  BUILDKIT_CI_IMAGE: "${ACR_REGISTRY}/opencsg_public/moby-buildkit:buildx-stable-1"

stages:
  - build

docker-build-push:
  stage: build
  image:
    name: ${ACR_REGISTRY}/opencsg_public/docker-ci:v1.0.1
    entrypoint: [""]
  services:
    - name: ${ACR_REGISTRY}/opencsg_public/docker:27.3-dind
      command: ["--feature=containerd-snapshotter", "--experimental"]
      alias: docker
  rules:
    - if: $CI_COMMIT_BRANCH == "add-csgclaw-channel"
      changes:
        - docker/csgclaw-cli/**/*
        - docker/csgclaw-cli/*
        - docker/Dockerfile
        - .gitlab/ci.yml
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - export TZ=Asia/Shanghai
    - echo "$ACR_PASSWORD" | docker login -u "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
    - export IMAGE_TAG="$(date +%Y).$(date +%-m).$(date +%-d)"
    - export DOCKER_IMAGE="${ACR_REGISTRY}/opencsghq/picoclaw"
    - echo "IMAGE_TAG=${IMAGE_TAG}" && echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
    - docker info
    - docker buildx version
    - |
      set -eu
      if [ "${SKIP_BINFMT_INSTALL:-}" = "true" ] || [ "${SKIP_BINFMT_INSTALL:-}" = "1" ]; then
        echo "SKIP_BINFMT_INSTALL: skip binfmt container (runner host must already support foreign arch RUN)"
      else
        echo "Installing binfmt from ${BINFMT_IMAGE}"
        docker run --rm --privileged "${BINFMT_IMAGE}" --install all
      fi
    - export BUILDX_BUILDER="picoclaw-mx-${CI_PIPELINE_ID}"
    - docker buildx rm "${BUILDX_BUILDER}" 2>/dev/null || true
    - echo "BuildKit image for buildx driver ${BUILDKIT_CI_IMAGE}"
    - docker buildx create --name "${BUILDX_BUILDER}" --driver docker-container --driver-opt "image=${BUILDKIT_CI_IMAGE}" --bootstrap --use
    - |
      set -euo pipefail
      echo "Checking runtime base image platforms: ${RUNTIME_ALPINE_BASE_IMAGE}"
      docker buildx imagetools inspect "${RUNTIME_ALPINE_BASE_IMAGE}" | tee /tmp/runtime-alpine-manifest.txt
      grep -Eq 'Platform:[[:space:]]+linux/amd64' /tmp/runtime-alpine-manifest.txt
      grep -Eq 'Platform:[[:space:]]+linux/arm64' /tmp/runtime-alpine-manifest.txt
  script:
    - |
      set -euo pipefail
      docker buildx build \
        --platform "${DOCKER_PLATFORMS}" \
        -f docker/Dockerfile \
        --build-arg "RUNTIME_ALPINE_BASE_IMAGE=${RUNTIME_ALPINE_BASE_IMAGE}" \
        -t "${DOCKER_IMAGE}:${IMAGE_TAG}" \
        --provenance=false \
        --sbom=false \
        --push \
        .
    - |
      set -euo pipefail
      docker buildx imagetools inspect "${DOCKER_IMAGE}:${IMAGE_TAG}"
      for entry in "linux/amd64:x86_64" "linux/arm64:aarch64"; do
        platform="${entry%%:*}"
        expected_arch="${entry##*:}"
        echo "Validating ${DOCKER_IMAGE}:${IMAGE_TAG} on ${platform}"
        docker run --rm --platform "${platform}" --entrypoint /bin/sh "${DOCKER_IMAGE}:${IMAGE_TAG}" -ec "
          test \"\$(uname -m)\" = \"${expected_arch}\"
          /sbin/tini --version >/dev/null
          /usr/local/bin/picoclaw version >/dev/null
          /usr/local/bin/csgclaw-cli --help >/dev/null
        "
      done
  after_script:
    - docker buildx rm "picoclaw-mx-${CI_PIPELINE_ID}" 2>/dev/null || true
